<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>سایت فروشگاهی محمدرضا</title>
  <link href="https://cdn.jsdelivr.net/npm/vazir-font@26.0.2/dist/font-face.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* فونت یکسان برای همه */
    * {
      font-family: Vazir, sans-serif !important;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f0f4f1, #dfe6e2);
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* اسکرول نرم */
    html {
      scroll-behavior: smooth;
    }

    /* نوار بالایی */
    .topbar {
      background: linear-gradient(90deg, #1b4332, #2d6a4f);
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      animation: slideDown 1s ease;
    }

    @keyframes slideDown {
      from {transform: translateY(-100%); opacity: 0;}
      to {transform: translateY(0); opacity: 1;}
    }

    /* نوار افقی */
    .navbar {
      background: linear-gradient(90deg, #2d6a4f, #1b4332);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      animation: fadeIn 1.5s ease;
    }

    .navbar a {
      color: #fff;
      text-align: center;
      padding: 18px 30px;
      text-decoration: none;
      position: relative;
      transition: all 0.3s ease;
      font-size: 18px;
    }

    .navbar a:hover {
      background-color: rgba(255,255,255,0.15);
      border-radius: 5px;
      transform: scale(1.05);
    }

    .navbar a::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background-color: #ffd60a;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .navbar a:hover::after {
      width: 70%;
    }

    /* محتوای اصلی */
    .content {
      padding: 30px;
      text-align: center;
      animation: fadeInUp 1.2s ease;
      color: #1b4332;
    }

    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* کانتینر کارت‌ها */
    .product-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    /* کارت محصول */
    .product-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      overflow: hidden;
      text-align: center;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      padding: 10px;
      animation: zoomIn 1s ease;
    }

    @keyframes zoomIn {
      from {transform: scale(0.8); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    }

    .product-card img {
      width: 100%;
      height: auto;
      display: block;
      transform: scale(0.9);
      transition: transform 0.4s ease;
    }

    .product-card:hover img {
      transform: scale(1);
    }

    .product-card h3 {
      margin: 8px 0;
      font-size: 16px;
      color: #1b4332;
      animation: fadeIn 1.5s ease;
    }

    .price {
      font-size: 16px;
      font-weight: bold;
      color: #2d6a4f;
      margin: 4px 0 10px;
      animation: fadeIn 1.5s ease;
    }

    .product-card button {
      background: linear-gradient(90deg, #2d6a4f, #40916c);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 8px;
      font-size: 14px;
      animation: bounceIn 1.2s ease;
    }

    @keyframes bounceIn {
      0% {transform: scale(0.8); opacity: 0;}
      60% {transform: scale(1.1); opacity: 1;}
      100% {transform: scale(1);}
    }

    .product-card button:hover {
      background: #52b788;
      transform: scale(1.08);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* واکنش‌گرایی برای موبایل */
    @media (max-width: 600px) {
      .product-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .product-card h3 { font-size: 14px; }
      .price { font-size: 15px; }
      .product-card button {
        width: 85%;
        font-size: 14px;
      }
      .product-card img {
        transform: scale(0.85);
      }
    }
  </style>
</head>
<body>
  <div class="topbar">سایت فروشگاهی محمدرضا</div>
  <div class="navbar">
    <a href="#about">ℹ️ درباره ما</a>
    <a href="#offline">🏬 حضوری</a>
    <a href="#support">📞 پشتیبانی</a>
    <a href="#cart">🛒 سبد خرید</a>
  </div>
  <div class="content">
    <h1>به فروشگاه محمدرضا خوش آمدید</h1>
    <div class="product-container">
      <div class="product-card">
        <img src="images/hudi.jpg" alt="هودی مشکی">
        <h3>هودی مشکی</h3>
        <p class="price">1.800.000 تومان</p>
        <button>🛒 افزودن به سبد</button>
      </div>
      <div class="product-card">
        <img src="images/v2k.jpg" alt="کتونی v2k">
        <h3>کتونی v2k</h3>
        <p class="price">1.450.000 تومان</p>
        <button>🛒 افزودن به سبد</button>
      </div>
      <div class="product-card">
        <img src="images/dorse meshki.jpg" alt="دورس مشکی">
        <h3>دورس مشکی</h3>
        <p class="price">1.500.000 تومان</p>
        <button>🛒 افزودن به سبد</button>
      </div>
      <div class="product-card">
        <img src="images/dorse swfid.jpg" alt="دورس سفید">
        <h3>دورس سفید</h3>
        <p class="price">1.500.000 تومان</p>
        <button>🛒 افزودن به سبد</button>
      </div>
      <div class="product-card">
        <img src="images/shalver bag.jpg" alt="شلوار بگ">
        <h3>شلوار بگ</h3>
        <p class="price">1.300.000 تومان</p>
        <button>🛒 افزودن به سبد</button>
      </div>
    </div>
  </div>
  <!-- اسکریپت جلوگیری از زوم و اسکرول نرم -->
  <script>
    // جلوگیری از Ctrl + Scroll
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    // جلوگیری از Ctrl + +/- یا Ctrl + 0
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
        e.preventDefault();
      }
    });

    // جلوگیری از pinch zoom در موبایل
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // اسکرول نرم برای لینک‌های داخلی
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>سبد خرید</title>
  <link href="https://cdn.jsdelivr.net/npm/vazir-font@26.0.2/dist/font-face.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * { font-family: Vazir, sans-serif !important; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: manipulation;
      background: linear-gradient(135deg, #f0f4f1, #dfe6e2);
      text-align: center;
      color: #1b4332;
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
      animation: bounceIn 1s ease;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    .cart-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      padding: 20px;
      max-width: 650px;
      margin: auto;
      text-align: right;
      transition: transform 0.3s ease;
    }

    .cart-box:hover { transform: translateY(-5px); }

    ul { list-style: none; padding: 0; }
    li {
      margin: 10px 0;
      border-bottom: 1px solid #ddd;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s ease;
    }

    li:hover { background: #f1f8f5; }

    .total {
      font-weight: bold;
      margin-top: 15px;
      font-size: 20px;
      color: #2d6a4f;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: linear-gradient(90deg, #2d6a4f, #40916c);
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn:hover {
      background: #52b788;
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .remove-btn {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: 0.3s;
    }

    .remove-btn:hover { background: #d00000; transform: scale(1.1); }

    .qty-btn {
      background: #40916c;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      margin: 0 5px;
      transition: 0.3s;
    }

    .qty-btn:hover { background: #2d6a4f; transform: scale(1.2); }

    .checkout-form {
      display: none;
      margin-top: 20px;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      animation: slideDown 0.6s ease forwards;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .checkout-form label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .checkout-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: 0.3s;
    }

    .checkout-form input:focus {
      border-color: #40916c;
      box-shadow: 0 0 8px rgba(64,145,108,0.4);
      transform: scale(1.02);
    }

    .submit-btn {
      margin-top: 15px;
      background: #2d6a4f;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #40916c;
      transform: scale(1.1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    /* واکنش‌گرایی برای موبایل */
    @media (max-width: 600px) {
      .cart-box { max-width: 95%; padding: 15px; }
      h1 { font-size: 24px; }
      .total { font-size: 18px; }
      .btn { width: 100%; text-align: center; }

      /* تغییرات مهم برای آیتم‌ها */
      li {
        flex-direction: column;
        align-items: flex-start;
      }

      li div {
        width: 100%;
        margin-top: 8px;
        justify-content: space-between;
      }

      li img {
        width: 60px;
        height: 60px;
      }

      .qty-btn, .remove-btn {
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>
  <h1>🛒 سبد خرید شما</h1>
  <div class="cart-box">
    <ul id="cart-items"></ul>
    <p id="cart-total" class="total">مجموع: 0 تومان</p>
    <div style="display:flex; gap:10px; margin-top:20px; flex-wrap:wrap;">
      <a href="index.html" class="btn">⬅️ بازگشت به فروشگاه</a>
      <button class="btn" onclick="showCheckout()">ادامه فرآیند خرید ➡️</button>
    </div>

    <!-- فرم اطلاعات مشتری -->
    <div id="checkout-form" class="checkout-form">
      <h3>اطلاعات مشتری</h3>
      <label>نام:</label>
      <input type="text" id="fname" placeholder="نام خود را وارد کنید">
      
      <label>نام خانوادگی:</label>
      <input type="text" id="lname" placeholder="نام خانوادگی خود را وارد کنید">
      
      <label>آدرس:</label>
      <input type="text" id="address" placeholder="آدرس کامل">
      
      <label>شماره تماس:</label>
      <input type="text" id="phone" placeholder="شماره تلفن">
      
      <button class="submit-btn" onclick="submitOrder()">ثبت سفارش ✅</button>
    </div>
  </div>

  <script>
    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const itemsList = document.getElementById('cart-items');
      let total = 0;
      itemsList.innerHTML = "";

      cart.forEach((item, index) => {
        if (!item.quantity) item.quantity = 1;

        const li = document.createElement('li');
        li.innerHTML = `
  <div style="flex: 1; display:flex; align-items:center; gap:10px; direction:ltr; text-align:left;">
    <img src="${item.image || 'images/default.png'}" alt="${item.product}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">
    <span style="unicode-bidi: plaintext;">${item.product}</span>
    <span>- ${(item.price * item.quantity).toLocaleString()} تومان</span>
  </div>
  <div style="display: flex; align-items: center;">
    <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
    <span style="margin: 0 5px;">${item.quantity}</span>
    <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
    <button class="remove-btn" onclick="removeItem(${index})">حذف</button>
  </div>
`;

        itemsList.appendChild(li);
        total += item.price * item.quantity;
      });

      document.getElementById('cart-total').innerText =
        "مجموع: " + total.toLocaleString() + " تومان";
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    function changeQty(index, delta) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (!cart[index].quantity) cart[index].quantity = 1;
      cart[index].quantity += delta;
      if (cart[index].quantity < 1) cart[index].quantity = 1;
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    function showCheckout() {
      const form = document.getElementById('checkout-form');
      form.style.display = "block";
      form.scrollIntoView({ behavior: "smooth" });
    }

    function submitOrder() {
      const fname = document.getElementById('fname').value.trim();
      const lname = document.getElementById('lname').value.trim();
      const address = document.getElementById('address').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const cart = JSON.parse(localStorage.getItem('cart')) || [];

      if(fname && lname && address && phone && cart.length > 0){
        alert("سفارش شما ثبت شد ✅");

        // خالی کردن سبد خرید
        localStorage.removeItem('cart');

        // می‌توانی اطلاعات مشتری را هم ذخیره کنی یا به صفحه‌ی تشکر منتقل شوی
      } else {
        alert("لطفاً همه فیلدها را پر کنید ❗");
      }
    }

    // جلوگیری از زوم با Ctrl + Scroll یا pinch zoom
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
        e.preventDefault();
      }
    });

    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    window.onload = loadCart;
  </script>
</body>
</html>

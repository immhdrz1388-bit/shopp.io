<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>سبد خرید</title>
  <link href="https://cdn.jsdelivr.net/npm/vazir-font@26.0.2/dist/font-face.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
  font-family: Vazir, sans-serif !important;
}

    body {
      font-family: Vazir, sans-serif;
      background: linear-gradient(135deg, #f0f4f1, #dfe6e2);
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #1b4332;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .cart-box {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      padding: 20px;
      max-width: 600px;
      margin: auto;
      text-align: right;
    }

    ul { list-style: none; padding: 0; }
    li {
      margin: 8px 0;
      border-bottom: 1px solid #ddd;
      padding: 5px;
      display: flex;
      justify-content: space-between;
    }

    .total {
      font-weight: bold;
      margin-top: 15px;
      font-size: 18px;
      color: #2d6a4f;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 18px;
      background: linear-gradient(90deg, #2d6a4f, #40916c);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .btn:hover {
      background: #52b788;
      transform: scale(1.05);
    }

    .remove-btn {
      background: #e63946;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    .remove-btn:hover {
      background: #d00000;
    }
  </style>
</head>
<body>
  <h1>🛒 سبد خرید شما</h1>
  <div class="cart-box">
    <ul id="cart-items"></ul>
    <p id="cart-total" class="total">مجموع: 0 تومان</p>
    <a href="index.html" class="btn">⬅️ بازگشت به فروشگاه</a>
  </div>

  <script>
    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const itemsList = document.getElementById('cart-items');
      let total = 0;
      itemsList.innerHTML = "";

      cart.forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span>${item.product} - ${item.price.toLocaleString()} تومان</span>
          <button class="remove-btn" onclick="removeItem(${index})">حذف</button>
        `;
        itemsList.appendChild(li);
        total += item.price;
      });

      document.getElementById('cart-total').innerText =
        "مجموع: " + total.toLocaleString() + " تومان";
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    window.onload = loadCart;
  </script>
</body>
</html>
